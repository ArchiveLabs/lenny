<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Lenny{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      /* Palette matches lenny-app's own tokens (packages/ui/src/styles/globals.css),
         itself sourced from Open Library's tokens.css — kept in sync by hand here
         since this page is server-rendered Jinja, not part of that build. */
      :root {
        --background: #faf9f4;
        --foreground: #3d382e;
        --card: #ffffff;
        --card-foreground: #3d382e;
        --primary: #1266ba;
        --primary-foreground: #ffffff;
        --muted-foreground: #77705f;
        --accent: #eaf0fb;
        --accent-foreground: #0b3c6f;
        --destructive: #8d3825;
        --destructive-foreground: #ffffff;
        --border: #e5e1d2;
        /* The boundary of anything a patron operates — buttons, text fields.
           WCAG 2.1 SC 1.4.11 wants 3:1 against the surface behind it; the
           previous #d1cbb7 measured 1.62:1 on the card, so a white decline
           button and every input had an edge that was decorative rather than
           visible. #9a9074 is the lightest value in the same warm neutral that
           clears it: 3.17:1 on the card, 3.01:1 on the page. --border stays
           light because it only ever draws dividers and container edges, which
           the criterion does not cover. */
        --input: #9a9074;
        --ring: #1266ba;
        --success: #4b723b;
        --success-bg: #ecf3e8;
        --success-border: #c5d7bc;
        --error-bg: #f9efec;
        --error-border: #e9ccc4;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--background);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--foreground);
      }
      .card {
        background: var(--card);
        color: var(--card-foreground);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        max-width: 400px;
        width: 100%;
        /* The card is white on a near-white page (1.04:1), so its 1px border
           was the only thing separating them. A soft shadow does the
           separating instead, which is what makes it read as a sheet. */
        box-shadow: 0 1px 2px rgba(61, 56, 46, 0.04),
                    0 8px 24px rgba(61, 56, 46, 0.07);
      }
      .card--wide { max-width: 480px; text-align: center; }
      h1 { font-size: 19px; margin-bottom: 6px; color: var(--card-foreground); text-align: center; }
      .subtitle { font-size: 14px; line-height: 1.4; color: var(--muted-foreground); text-align: center; margin-bottom: 24px; }
      .email { color: var(--primary); font-weight: 600; }
      .email--success { color: var(--success); }
      .error {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--destructive);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      label { display: block; font-size: 14px; color: var(--muted-foreground); margin-bottom: 6px; }
      input[type="email"], input[type="text"] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--input);
        border-radius: 8px;
        background: var(--card);
        color: var(--card-foreground);
        font-size: 16px;
        margin-bottom: 20px;
      }
      input:focus { outline: none; border-color: var(--ring); }
      .btn {
        width: 100%;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        color: var(--primary-foreground);
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn--primary { background: var(--primary); }
      .btn--primary:hover { opacity: 0.92; }
      .btn--success { background: var(--success); color: #ffffff; }
      .btn--success:hover { opacity: 0.92; }
      .btn--link {
        background: none;
        width: auto;
        display: block;
        margin: 16px auto 0;
        padding: 6px 8px;
        color: var(--muted-foreground);
        font-size: 13px;
        text-decoration: underline;
      }
      .btn--link:hover { transform: none; color: var(--foreground); }
      .btn--link:disabled { color: var(--border); text-decoration: none; cursor: default; }
      .resend-status { text-align: center; font-size: 12px; margin-top: 8px; min-height: 16px; color: var(--muted-foreground); }
      .resend-status--ok { color: var(--success); }
      .resend-status--error { color: var(--destructive); }
      .success-icon {
        width: 64px;
        height: 64px;
        background: var(--success);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 32px;
      }
      .token-info {
        background: var(--accent);
        border-radius: 8px;
        padding: 16px;
        margin: 24px 0;
        text-align: left;
        font-size: 12px;
        font-family: 'SF Mono', Monaco, monospace;
        word-break: break-all;
        color: var(--accent-foreground);
        border: 1px solid var(--border);
      }
      .token-info strong { color: var(--card-foreground); }
      .otp-input {
        font-size: 16px;
        letter-spacing: 3px;
        text-align: center;
      }
      /* The tracking is for six typed digits; applied to the placeholder it
         pulls the words apart and reads as a rendering fault. */
      .otp-input::placeholder { letter-spacing: normal; }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
      }
      .badge--oauth { background: var(--accent); color: var(--accent-foreground); border: 1px solid var(--border); }

      /* ── Why this sign-in is happening ────────────────────────────────────
         Rendered above the credential on both sign-in screens, and only when
         the patron arrived from a consumer (`client_name` comes from the
         signed login context, so a bare OPDS sign-in has none and gets the
         plain page it always had).

         The order is the point. The screens used to open with a one-time
         password and never say what it was for, so a patron spent a step and
         handed over a credential before learning that something wanted to
         borrow on their behalf — and then met the consent screen as a
         surprise. Context first, credential second, and a sentence saying a
         choice is still coming. */
      .purpose {
        text-align: left;
        background: var(--accent);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 22px;
      }
      .purpose__lead {
        font-size: 15px; line-height: 1.45; margin: 0;
        color: var(--accent-foreground);
      }
      .purpose__lead strong { font-weight: 700; }
      .purpose__list {
        list-style: none; padding: 0; margin: 12px 0 0;
        display: flex; flex-direction: column; gap: 7px;
      }
      .purpose__list li {
        position: relative; padding-left: 24px;
        font-size: 13.5px; line-height: 1.4; color: var(--accent-foreground);
      }
      /* A check rather than a bullet: these are things the patron is about to
         be able to allow, not a list of facts. */
      .purpose__list li::before {
        content: ""; position: absolute; left: 4px; top: 4px;
        width: 9px; height: 5px; border-left: 2px solid currentColor;
        border-bottom: 2px solid currentColor; transform: rotate(-45deg);
        opacity: 0.75;
      }
      .next-step {
        margin: 18px 0 0; padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 13px; line-height: 1.5;
        color: var(--muted-foreground); text-align: left;
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
