{% extends "_base_auth.html" %}

{% block title %}{{ heading }} - Lenny{% endblock %}

{% block content %}
<div class="card" role="main" aria-labelledby="members-title">
  <h1 id="members-title">{{ heading }}</h1>
  <p class="subtitle">{{ explanation }}</p>
  {% if site %}
  <p class="members-back"><a class="btn btn--primary" href="{{ site }}">Go to the publisher's site</a></p>
  {% endif %}
  {% if code %}<p class="members-code">Error: <code>{{ code }}</code></p>{% endif %}
</div>

<style>
  .members-back { text-align: center; margin: 8px 0 0; font-size: 15px; }
  .members-back a { color: var(--primary); font-weight: 600; }
  .members-back a:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .members-code { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted-foreground); }
</style>
{% endblock %}
