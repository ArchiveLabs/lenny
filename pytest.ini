[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = --color=yes
markers =
    real_edition_lookup: let a bulk-import test exercise the real Open Library edition lookup (HTTP faked by the test)
env =
    LENNY_SEED=test-seed-for-unit-tests-32chars
    LENNY_EMAIL_HASH_KEY=test-email-hash-key-for-unit-tests
