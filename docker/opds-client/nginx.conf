server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The client has no router: one page at "/", state in ?opds=. Only that page
  # falls back to index.html; a missing asset must 404, not return HTML.
  location = / {
    try_files /index.html =404;
  }

  location /_app/ {
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /public/ {
    access_log off;
    try_files $uri =404;
  }

  location = /service-worker.js { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
}
