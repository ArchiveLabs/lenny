server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The client has no router: one page at "/", state in ?opds=. Only that page
  # falls back to index.html; a missing asset must 404, not return HTML.
  location = / {
    try_files /index.html =404;
  }

  location /_app/ {
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /public/ {
    access_log off;
    try_files $uri =404;
  }

  location = /service-worker.js { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }

  # The same client, mounted at /app, for a host whose "/" is owned by another
  # site (e.g. lennyforlibraries.org's marketing page). Served from the second
  # shell (build/app/index.html, base=/app) plus the one asset tree aliased
  # under /app/ — one copy of the files on disk, two URL prefixes. A default
  # install keeps "/" above and simply leaves /app dormant.
  #
  # The /app -> /app/ redirect is load-bearing: the shell's refs are absolute
  # (/app/_app/...), so the SPA works at any depth, but /app/public/manifest.json
  # and the SvelteKit base are pinned to the /app/ mount.
  # absolute_redirect off: nginx listens on 80 inside the container and knows
  # nothing of the public scheme or port, so an absolute Location would send a
  # TLS patron to http://host/app/. A relative one keeps their origin intact.
  location = /app {
    absolute_redirect off;
    return 308 /app/;
  }

  location = /app/ {
    try_files /app/index.html =404;
  }

  # alias (not try_files): a missing asset 404s naturally, never returns HTML.
  location /app/_app/ {
    alias /usr/share/nginx/html/_app/;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  location /app/public/ {
    alias /usr/share/nginx/html/public/;
    access_log off;
  }

  location = /app/service-worker.js { alias /usr/share/nginx/html/service-worker.js; }
  location = /app/robots.txt { alias /usr/share/nginx/html/robots.txt; }
}
