name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure VERSION is bumped for deployable changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^(lenny/|docker/|alembic/versions/|compose\.yaml|configure\.sh|requirements\.txt)'; then
            if ! echo "$CHANGED_FILES" | grep -qx 'VERSION'; then
              echo ""
              echo "::error::This PR changes deployable code/config but doesn't bump VERSION."
              echo "::error::'make update' on existing installs only runs its pipeline (env sync, migrations, rebuild) when VERSION differs from the installed version — see docs/plans/releasing-updates.md."
              echo "::error::Bump VERSION in this PR (e.g. echo \"0.0.0\" > VERSION) or confirm this change truly needs no update-pipeline run."
              exit 1
            fi
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          pytest -v
